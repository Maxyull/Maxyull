name: Update README cards

# Generates the github-readme-stats cards as static SVGs committed to this repo.
# The public instance at github-readme-stats.vercel.app answers 503 too often to
# be embedded directly: the cards were removed twice for that reason (2026-07-19
# and 2026-08-02). Generated here, they are served by GitHub itself and cannot
# break at read time.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Stats card (light)
        uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=Maxyull&show_icons=true&hide_border=true&theme=default
          path: cards/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Stats card (dark)
        uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=Maxyull&show_icons=true&hide_border=true&theme=github_dark
          path: cards/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Top languages card (light)
        uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=Maxyull&layout=compact&hide_border=true&langs_count=8&theme=default
          path: cards/langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Top languages card (dark)
        uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=Maxyull&layout=compact&hide_border=true&langs_count=8&theme=github_dark
          path: cards/langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      # Same reasoning as the cards above, applied to the two services this
      # workflow does not render itself: fetched here, committed, and served by
      # GitHub. camo (GitHub's image proxy) gives up on streak-stats when it is
      # slow, which showed as a broken image on the profile. A failure here is
      # not fatal: the step is skipped and the previously committed SVG stays.
      - name: Fetch the streak and activity cards
        continue-on-error: true
        run: |
          set -uo pipefail
          fetch() {
            curl -sS --fail --retry 3 --retry-delay 5 --max-time 90 "$1" -o "$2.tmp" \
              && mv "$2.tmp" "$2" \
              || { echo "::warning::$2 not refreshed, keeping the committed one"; rm -f "$2.tmp"; }
          }
          streak="https://streak-stats.demolab.com/?user=Maxyull&hide_border=true&date_format=j%20M%5B%20Y%5D"
          graph="https://github-readme-activity-graph.vercel.app/graph?username=Maxyull&hide_border=true&area=true"
          fetch "$streak&theme=default"          cards/streak-light.svg
          fetch "$streak&theme=github-dark-blue" cards/streak-dark.svg
          fetch "$graph&theme=minimal"           cards/graph-light.svg
          fetch "$graph&theme=github-compact"    cards/graph-dark.svg

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*.svg
          git diff --cached --quiet && echo "cards unchanged" && exit 0
          git commit -m "Update README cards"
          git push
